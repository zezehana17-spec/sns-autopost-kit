# 30분마다 발행 앱을 깨운다 (무료 Vercel은 자동 실행이 하루 1번뿐이라서).
# 새 글을 올리면(push) 배포를 기다렸다가 바로 한 번 더 깨운다.
name: publish
on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
    paths: ["outbox/**", "public/media/**"]
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: 새 글이면 배포 기다리기
        if: github.event_name == 'push'
        run: sleep 150
      - name: 발행 실행
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "SITE_URL, CRON_SECRET 시크릿을 먼저 넣어 주세요"; exit 1; fi
          for i in 1 2 3; do
            code=$(curl -s -o out.json -w "%{http_code}" --max-time 70 -X POST -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/run")
            cat out.json; echo
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          exit 1
